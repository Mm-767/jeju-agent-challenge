<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>행사 효과 나란히</title>
  <style>
    body {
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1f2328;
    }
    .band {
      padding: 8px 12px;
      background: #eef6ee;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      font-size: 18px;
      padding: 12px 24px;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="band" id="band">공개 데이터 모드: 외부 AI 연결 가능</div>
  <h1>행사 효과 나란히</h1>
  <p>읍면에서 열린 축제가 지역 소비를 얼마나 늘렸는지, 행사 전 흐름이 비슷한 읍면과 나란히 놓고 계산합니다.</p>
  <button id="demo">예시로 해 보기</button>
  <p id="status"></p>
  <script>
    document.getElementById("demo").onclick = async () => {
      const r = await fetch("/api/health");
      document.getElementById("status").textContent =
        r.ok ? "서버 연결됨 (분석 기능은 준비 중)" : "서버 연결 실패";
    };
  </script>
</body>
</html>
